name: CI

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: team-calendar
          POSTGRES_PASSWORD: team-calendar
          POSTGRES_DB: team-calendar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://team-calendar:team-calendar@localhost:5432/team-calendar_test
      # Throwaway 32-byte base64 value. CI never talks to Xero; this only
      # satisfies the required env schema in packages/xero/keys.ts so the
      # build can run. Not a secret and not used in any deployment.
      XERO_TOKEN_ENCRYPTION_KEY: WE552bw0+Wd6mi3TXcaj5P72E2x7gA7UPna73SevrmE=

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: cd packages/database && bunx prisma generate

      - name: Lint
        run: bun run check

      # Build before typecheck: all three Next.js apps include
      # ".next/types/**/*.ts" in their tsconfig include array, and that
      # directory is generated by next build. Without this step the CI
      # typecheck silently skips Next's generated route validators, making it
      # weaker than a local typecheck.
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Run migrate deploy
        run: bun run migrate:deploy

      - name: Drift check (schema must match deployed migrations)
        run: |
          cd packages/database
          output=$(DATABASE_URL=$DATABASE_URL bunx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --script 2>&1)
          echo "$output"
          if ! echo "$output" | grep -q "This is an empty migration"; then
            echo "ERROR: schema drift detected between migrations and schema.prisma"
            exit 1
          fi

      - name: Guard against untestable workspaces
        run: |
          status=0
          for manifest in apps/*/package.json packages/*/package.json; do
            dir=$(dirname "$manifest")
            if find "$dir" -name node_modules -prune -o -name '*.test.ts' -print -o -name '*.test.tsx' -print | grep -q .; then
              if ! node -e "process.exit(require('./$manifest').scripts?.test ? 0 : 1)"; then
                echo "ERROR: $dir contains test files but declares no test script"
                status=1
              fi
            fi
          done
          exit $status

      - name: Run unit tests
        run: bun run test

      - name: Run integration tests
        run: bun run test:integration
